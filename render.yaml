services:
  - type: web
    name: recoverai-backend
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/server.js
    envVars:
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: recoverai-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://recoverai-revenue-recovery.vercel.app # Update with your Vercel deployment URL after creation

databases:
  - name: recoverai-db
    plan: free
    databaseName: recoverai
    user: recoverai_admin
